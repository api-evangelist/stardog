          application/n-quads:
            schema:
              type: String
            examples:
              REASONING_AXIOM_TTL:
                description: REASONING_AXIOM_TTL
                value: null
                $ref: '#/components/examples/REASONING_AXIOM_TTL'
          application/ld+json:
            schema:
              type: String
            examples:
              REASONING_AXIOM_JSONLD:
                description: REASONING_AXIOM_JSONLD
                value: null
                $ref: '#/components/examples/REASONING_AXIOM_JSONLD'
        required: true
