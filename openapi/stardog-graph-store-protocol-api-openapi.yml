openapi: 3.2.0
info:
  title: Stardog HTTP Graph Store Protocol API
  description: '# Overview

    Stardog supports the standard SPARQL Protocol HTTP bindings, as well as additional functionality via HTTP.'
  contact:
    url: https://stardog.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: 12.0.3
  x-logo:
    url: https://d33wubrfki0l68.cloudfront.net/66e9dcff51317cfc11b9f3d4ce2917a11ba81681/543c1/img/stardog-logo-optimized.svg
servers:
- url: http://localhost:5820
tags:
- name: Graph Store Protocol
  description: Operations on named graphs as detailed in https://www.w3.org/TR/sparql11-http-rdf-update/
paths:
  /{db}:
    get:
      tags:
      - Graph Store Protocol
      summary: GET graph
      description: Retrieves an RDF payload that is a serialization of the named graph paired with the graph IRI in the database
      operationId: getGraph
      parameters:
      - name: db
        $ref: '#/components/parameters/db'
      - name: graph
        in: query
        description: IRI of the named graph to retrieve
        schema:
          type: string
      - name: default
        in: query
        description: Include instead of 'graph' to operate on the default graph
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/NAMED_GRAPH'
        '404':
          description: Database does not exist
          content:
            application/json:
              schema:
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    example: Database does not exist
                  code:
                    type: string
                    example: 0D0DU2
    put:
      tags:
      - Graph Store Protocol
      summary: PUT graph
      description: Stores the enclosed RDF payload as RDF graph content
      operationId: setGraph
      parameters:
      - name: db
        $ref: '#/components/parameters/db'
      - name: graph
        in: query
        description: IRI of the target named graph
        schema:
          type: string
      - name: default
        in: query
        description: Include instead of 'graph' to operate on the default graph
        schema:
          type: string
      - $ref: '#/components/parameters/header_content_encoding'
      requestBody:
        $ref: '#/components/requestBodies/NAMED_GRAPH'
      responses:
        '200':
          description: Graph overwritten
        '201':
          description: Graph created
          headers:
            Location:
              style: simple
              schema:
                type: string
                format: URI
        '404':
          description: Database does not exist
          content:
            application/json:
              schema:
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    example: Database does not exist
                  code:
                    type: string
                    example: 0D0DU2
    post:
      tags:
      - Graph Store Protocol
      summary: POST graph
      description: Merges the enclosed RDF payload with the specified graph content
      operationId: appendToGraph
      parameters:
      - name: db
        $ref: '#/components/parameters/db'
      - name: graph
        in: query
        description: IRI of the target named graph
        schema:
          type: string
      - name: default
        in: query
        description: Include instead of 'graph' to operate on the default graph
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/NAMED_GRAPH'
      responses:
        '200':
          description: Graph merged
        '404':
          description: Database does not exist
          content:
            application/json:
              schema:
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    example: Database does not exist
                  code:
                    type: string
                    example: 0D0DU2
    delete:
      tags:
      - Graph Store Protocol
      summary: DELETE graph
      description: Deletes the RDF graph content identified by either the request or encoded IRI
      operationId: dropGraph
      parameters:
      - name: db
        $ref: '#/components/parameters/db'
      - name: graph
        in: query
        description: IRI of the named graph to delete
        schema:
          type: string
      - name: default
        in: query
        description: Include instead of 'graph' to operate on the default graph
        schema:
          type: string
      responses:
        '200':
          description: Graph deleted
        '404':
          description: Database does not exist
          content:
            application/json:
              schema:
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    example: Database does not exist
                  code:
                    type: string
                    example: 0D0DU2
    head:
      tags:
      - Graph Store Protocol
      summary: HEAD graph
      description: Test dereferenceable IRIs for validity and accessibility
      operationId: checkGraph
      parameters:
      - name: db
        $ref: '#/components/parameters/db'
      - name: graph
        in: query
        description: IRI of the target named graph
        schema:
          type: string
      - name: default
        in: query
        description: Include instead of 'graph' to operate on the default graph
        schema:
          type: string
      responses:
        '200':
          description: Graph exists and is accessible
        '404':
          description: Database does not exist
          content:
            application/json:
              schema:
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    example: Database does not exist
                  code:
                    type: string
                    example: 0D0DU2
components:
  examples:
    GENERIC_TRIG:
      value: "@prefix : <urn:example:> .\n@prefix owl: <http://www.w3.org/2002/07/owl#> .\n@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix stardog: <tag:stardog:api:> .\n@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n\n{ \t<urn:example:Entity1> a <urn:example:Entity> ;\n\t\t <urn:example:hasProp> 42 .\n}"
    GENERIC_NQUADS:
      value: '<urn:context> <urn:example:Entity1> a <urn:example:Entity> .

        <urn:context> <urn:example:Entity1> <urn:example:hasProp> 42 .'
    GENERIC_TURTLE:
      value: "@prefix : <urn:example:> .\n@prefix owl: <http://www.w3.org/2002/07/owl#> .\n@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix stardog: <tag:stardog:api:> .\n@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n\n<urn:example:Entity1> a <urn:example:Entity> ;\n\t<urn:example:hasProp> 42 ."
    SPARQL_RESULTS_XML:
      value: "<?xml version='1.0' encoding='UTF-8'?>\n<sparql xmlns='http://www.w3.org/2005/sparql-results#'>\n    <head>\n        <variable name='s'/>\n        <variable name='label'/>\n    </head>\n    <results>\n        <result>\n            <binding name='s'>\n                <uri>http://example.org/stardog#Example1</uri>\n            </binding>\n            <binding name='label'>\n                <literal>42</literal>\n            </binding>\n        </result>\n        <result>\n            <binding name='s'>\n                <uri>http://example.org/stardog#Example2</uri>\n            </binding>\n            <binding name='label'>\n                <literal>foo</literal>\n            </binding>\n        </result>\n    </results>\n</sparql>"
    SPARQL_RESULTS_CSV:
      value: 's,label

        http://example.org/stardog#Example1,42

        http://example.org/stardog#Example2,foo'
    GENERIC_NTRIPLES:
      value: '<urn:example:Entity1> a <urn:example:Entity> .

        <urn:example:Entity1> <urn:example:hasProp> 42 .'
    SPARQL_RESULTS_TSV:
      value: "?s\t?label\n<http://example.org/stardog#Example1>\t\"42\"\n<http://example.org/stardog#Example2>\t\"foo\""
    GENERIC_RDFXML:
      value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<rdf:RDF\n\txmlns=\"http://api.stardog.com/\"\n\txmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\"\n\txmlns:owl=\"http://www.w3.org/2002/07/owl#\"\n\txmlns:rdfs=\"http://www.w3.org/2000/01/rdf-schema#\"\n\txmlns:stardog=\"tag:stardog:api:\"\n\txmlns:xsd=\"http://www.w3.org/2001/XMLSchema#\">\n\n<rdf:Description rdf:about=\"urn:example:Entity1\">\n\t<rdf:type rdf:resource=\"urn:example:Entity\"/>\n\t<hasProp xmlns=\"urn:example:\" rdf:datatype=\"http://www.w3.org/2001/XMLSchema#integer\">42</hasProp>\n</rdf:Description>\n\n</rdf:RDF>"
  schemas:
    GENERIC_JSONLD:
      properties:
        '@id':
          type: string
          example: urn:example:Entity1
        '@type':
          type: string
          example: urn:example:Entity
        urn:example:hasProp:
          required:
          - '@id'
          type: array
          items:
            required:
            - '@value'
            properties:
              '@type':
                type: string
                example: http://www.w3.org/2001/XMLSchema#integer
              '@value':
                type: string
                example: '42'
    SPARQL_RESULTS_JSON:
      required:
      - head
      - results
      properties:
        head:
          required:
          - vars
          properties:
            vars:
              type: array
              items:
                type: string
        results:
          required:
          - bindings
          properties:
            bindings:
              type: array
              items:
                additionalProperties:
                  required:
                  - type
                  - value
                  properties:
                    type:
                      type: string
                      example: literal
                    value:
                      type: string
                      example: '42'
  requestBodies:
    NAMED_GRAPH:
      description: RDF serialization of the named graph
      content:
        text/turtle:
          schema:
            type: string
          examples:
            GENERIC_TURTLE:
              value: null
              $ref: '#/components/examples/GENERIC_TURTLE'
        application/trig:
          schema:
            type: string
          examples:
            GENERIC_TRIG:
              value: null
              $ref: '#/components/examples/GENERIC_TRIG'
        application/rdf+xml:
          schema:
            type: string
          examples:
            GENERIC_RDFXML:
              value: null
              $ref: '#/components/examples/GENERIC_RDFXML'
        application/n-triples:
          schema:
            type: string
          examples:
            GENERIC_NTRIPLES:
              value: null
              $ref: '#/components/examples/GENERIC_NTRIPLES'
        application/n-quads:
          schema:
            type: string
          examples:
            GENERIC_NQUADS:
              value: null
              $ref: '#/components/examples/GENERIC_NQUADS'
        application/ld+json:
          schema:
            $ref: '#/components/schemas/GENERIC_JSONLD'
      required: true
  parameters:
    db:
      name: db
      in: path
      description: Database name
      required: true
      schema:
        type: string
      example: myDb
    header_content_encoding:
      name: Content-Encoding
      in: header
      description: Allowable encodings for request body
      schema:
        type: string
        enum:
        - NONE
        - GZIP
        - BZIP2
        - ZIP
  responses:
    NAMED_GRAPH:
      description: RDF serialization of the named graph
      content:
        text/turtle:
          schema:
            type: string
          examples:
            GENERIC_TURTLE:
              value: null
              $ref: '#/components/examples/GENERIC_TURTLE'
        application/trig:
          schema:
            type: string
          examples:
            GENERIC_TRIG:
              value: null
              $ref: '#/components/examples/GENERIC_TRIG'
        application/rdf+xml:
          schema:
            type: string
          examples:
            GENERIC_RDFXML:
              value: null
              $ref: '#/components/examples/GENERIC_RDFXML'
        application/n-triples:
          schema:
            type: string
          examples:
            GENERIC_NTRIPLES:
              value: null
              $ref: '#/components/examples/GENERIC_NTRIPLES'
        application/n-quads:
          schema:
            type: string
          examples:
            GENERIC_NQUADS:
              value: null
              $ref: '#/components/examples/GENERIC_NQUADS'
        application/ld+json:
          schema:
            $ref: '#/components/schemas/GENERIC_JSONLD'
        application/sparql-results+xml:
          schema:
            type: string
          examples:
            SPARQL_RESULTS_XML:
              value: null
              $ref: '#/components/examples/SPARQL_RESULTS_XML'
        application/sparql-results+json:
          schema:
            $ref: '#/components/schemas/SPARQL_RESULTS_JSON'
        text/csv:
          schema:
            type: string
          examples:
            SPARQL_RESULTS_CSV:
              value: null
              $ref: '#/components/examples/SPARQL_RESULTS_CSV'
        text/tsv:
          schema:
            type: string
          examples:
            SPARQL_RESULTS_TSV:
              value: null
              $ref: '#/components/examples/SPARQL_RESULTS_TSV'
