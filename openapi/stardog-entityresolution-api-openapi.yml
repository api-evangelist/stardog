servers:
- url: http://localhost:5820
tags:
- name: EntityResolution
  description: Operations for running Entity Resolution
paths:
  /{db}/entityresolution:
    post:
      tags:
      - EntityResolution
      summary: Resolve entities
      operationId: resolveEntities
      parameters:
      - name: db
        $ref: '#/components/parameters/db'
      responses:
        '200':
          description: Operation successful
        '404':
          description: Database does not exist
          content:
            application/json:
              schema:
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    example: Database does not exist
                  code:
                    type: string
                    example: 0D0DU2
  /{db}/entityresolution/reasoning:
    post:
      tags:
      - EntityResolution
      summary: Resolve entities with reasoning enabled
      operationId: resolveEntitiesWithReasoningEnabled
      parameters:
      - name: db
        $ref: '#/components/parameters/db'
      - $ref: '#/components/parameters/reasoning'
      - $ref: '#/components/parameters/schema'
      responses:
        '200':
          description: Operation successful
        '404':
          description: Database does not exist
          content:
            application/json:
              schema:
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    example: Database does not exist
                  code:
                    type: string
                    example: 0D0DU2
components:
  parameters:
    db:
      name: db
      in: path
      description: Database name
      required: true
      schema:
        type: string
      example: myDb
    reasoning:
      name: reasoning
      in: query
      description: Enable Reasoning
      schema:
        type: boolean
    schema:
      name: schema
      in: query
      description: The name of the schema
      schema:
        type: string
