servers:
- url: http://localhost:5820
tags:
- name: Data Caching
  description: Operations for working with cached data
paths:
  /admin/cache/refresh/{name}:
    post:
      tags:
      - Data Caching
      summary: Refresh cache
      operationId: refreshCache
      parameters:
      - name: name
        in: path
        description: The name of the cache
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Operation successful
          content:
            text/plain:
              example: Refreshed query with 42 solutions
  /admin/cache:
    post:
      tags:
      - Data Caching
      summary: Create cache
      description: Create a new cached dataset from a virtual graph
      operationId: createCache
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CACHE_OBJ'
        required: true
      responses:
        '200':
          description: Operation successful
          content:
            text/plain:
              example: Cached query with 42 solutions
  /admin/cache/graphs:
    get:
      tags:
      - Data Caching
      summary: Get cached graphs
      operationId: getCachedGraphs
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CACHE_GRAPH_LIST'
  /admin/cache/target/{name}/orphan:
    delete:
      tags:
      - Data Caching
      summary: Orphan cache target
      description: Orphan a cache target but do not destroy the contents
      operationId: orphanCacheTarget
      parameters:
      - name: name
        in: path
        description: The name of the target
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Target orphaned
  /admin/cache/{name}:
    delete:
      tags:
      - Data Caching
      summary: Drop cache
      operationId: dropCache
      parameters:
      - name: name
        in: path
        description: The name of the cache
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache dropped
  /admin/cache/target/{name}:
    delete:
      tags:
      - Data Caching
      summary: Remove cache target
      description: Remove a cache target and destroy its contents
      operationId: removeCacheTarget
      parameters:
      - name: name
        in: path
        description: The name of the target
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Target removed
  /admin/cache/target:
    get:
      tags:
      - Data Caching
      summary: List cache targets
      operationId: listCacheTargets
      responses:
        '200':
          description: List of cache targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CACHE_TARGET_LIST'
    post:
      tags:
      - Data Caching
      summary: Add cache target
      operationId: addCacheTarget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CACHE_TARGET'
        required: true
      responses:
        '201':
          description: Cache target added
  /admin/cache/status:
    post:
      tags:
      - Data Caching
      summary: Get cache status
      description: Retrieve the status of one or more cached graphs or queries
      operationId: cachedDatasetStatus
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/URI'
        required: true
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CACHE_STATUS_LIST'
components:
  schemas:
    URI:
      type: string
      format: URI
    CACHE_TARGET:
      required:
      - name
      - hostname
      - port
      - username
      - password
      properties:
        name:
          type: string
        hostname:
          type: string
        port:
          type: integer
          format: int32
        username:
          type: string
        password:
          type: string
        useExistingDb:
          type: boolean
          description: If true, check for an existing cache database to use before creating a new one
          default: false
    CACHE_OBJ:
      required:
      - name
      - target
      properties:
        name:
          type: string
          format: URI
        target:
          type: string
        database:
          type: string
        refreshScript:
          type: string
          description: An optional SPARQL Insert query to run when refreshing the cache
        query:
          type: string
          description: Query to cache. Mutually exclusive with "graph"
        graph:
          type: string
          description: Graph to cache. Mutually exclusive with "query"
        registerOnly:
          type: boolean
          description: If true, register a cached dataset without loading data from the source graph or query into the cache target's databases
          default: false
    CACHE_TARGET_LIST:
      type: array
      items:
        $ref: '#/components/schemas/CACHE_TARGET'
    CACHE_STATUS_LIST:
      type: array
      items:
        properties:
          name:
            type: string
            format: URI
          type:
            type: string
            enum:
            - graph
            - query
          target:
            type: string
          size:
            type: integer
            format: int64
            example: 42
          lastRefresh:
            type: string
            format: date
    CACHE_GRAPH_LIST:
      type: array
      items:
        properties:
          name:
            type: string
            format: URI
          target:
            $ref: '#/components/schemas/CACHE_TARGET'
          database:
            type: string
          refreshScript:
            type: string
            description: An optional SPARQL Insert query to run when refreshing the cache
          graph:
            type: string
