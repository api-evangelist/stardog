            examples:
              REASONING_AXIOM_TTL:
                description: REASONING_AXIOM_TTL
                value: null
                $ref: '#/components/examples/REASONING_AXIOM_TTL'
          application/trig:
            schema:
              type: String
            examples:
              REASONING_AXIOM_TTL:
                description: REASONING_AXIOM_TTL
                value: null
                $ref: '#/components/examples/REASONING_AXIOM_TTL'
          application/rdf+xml:
            schema:
              type: String
            examples:
              REASONING_AXIOM_RDFXML:
                description: REASONING_AXIOM_RDFXML
                value: null
                $ref: '#/components/examples/REASONING_AXIOM_RDFXML'
          application/n-triples:
            schema:
