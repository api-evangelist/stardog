openapi: 3.2.0
info:
  title: Stardog HTTP Server Admin API
  description: '# Overview

    Stardog supports the standard SPARQL Protocol HTTP bindings, as well as additional functionality via HTTP.'
  contact:
    url: https://stardog.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: 12.0.3
  x-logo:
    url: https://d33wubrfki0l68.cloudfront.net/66e9dcff51317cfc11b9f3d4ce2917a11ba81681/543c1/img/stardog-logo-optimized.svg
servers:
- url: http://localhost:5820
tags:
- name: Server Admin
  description: Server administration operations. May require superuser permissions
paths:
  /admin/sdu-usage/summary:
    get:
      tags:
      - Server Admin
      summary: Get SDU usage summary statistics
      description: Retrieve aggregated summary statistics for SDU (Stardog Data Unit) usage events. Returns total queries, total elapsed time, and breakdowns by user, database, and agent. Optionally filter by start and end timestamps in ISO-8601 format (e.g., 2023-12-18T12:00:00Z).
      operationId: getSDUUsageSummary
      responses:
        '200':
          description: SDU usage summary returned as JSON object
        '401':
          description: Not authorized to read logs
  /admin/healthcheck:
    get:
      tags:
      - Server Admin
      summary: Server health check
      description: Determine whether the server is running and able to accept traffic
      operationId: healthCheck
      responses:
        '200':
          description: Server is running and healthy
        '503':
          description: Server is unavailable
  /admin/diagnostics:
    post:
      tags:
      - Server Admin
      summary: Get server diagnostics report
      operationId: generateDiagnosticsReport
      responses:
        '200':
          description: Server diagnostics report zip created
  /admin/alive:
    get:
      tags:
      - Server Admin
      summary: Server aliveness check
      description: Determine whether the server is running
      operationId: aliveCheck
      responses:
        '200':
          description: Server is running
  /admin/sdu-usage:
    get:
      tags:
      - Server Admin
      summary: Get SDU usage events (streaming)
      description: Retrieve SDU (Stardog Data Unit) usage events from the sdu_usage.log file. Events are streamed to avoid memory issues under heavy load. Optionally filter by start and end timestamps in ISO-8601 format (e.g., 2023-12-18T12:00:00Z).
      operationId: getSDUUsageEvents
      responses:
        '200':
          description: SDU usage events returned as streamed JSON array
        '401':
          description: Not authorized to read logs
  /admin/logs:
    get:
      tags:
      - Server Admin
      summary: Get server logs
      description: Retrieve server logs as a zip file. Supports filtering by log types, including rotated logs, and limiting the number of lines returned.
      operationId: getLogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LOGS_OPTIONS'
      responses:
        '200':
          description: Server logs zip returned
  /admin/shutdown:
    post:
      tags:
      - Server Admin
      summary: Shutdown server
      operationId: shutdown
      responses:
        '200':
          description: Shutdown request received
        '405':
          description: Remote shutdowns not allowed
components:
  schemas:
    LOGS_OPTIONS:
      properties:
        log.rotated:
          type: boolean
          description: Flag to include rotated logs or not
          default: false
        log.types:
          type: array
          description: 'List of log types to include in the output. Default: [stardog, starrocks, gc]'
          items:
            type: string
            enum:
            - stardog
            - starrocks
            - audit
            - gc
        log.line.count:
          type: integer
          description: The last N number of lines to return
          format: int32
          example: 42
externalDocs:
  url: https://docs.stardog.com
x-tagGroups:
- name: Data Unification
  tags:
  - Data Sources
  - Virtual Graphs
- name: Virtual Graphs External Compute
  tags:
  - Virtual Graphs External Compute
- name: Server
  tags:
  - Monitoring
  - Stored Functions
  - Server Status/Metrics
  - Server Admin
  - Queries
  - Cluster Admin
- name: Database
  tags:
  - Checkpoints
  - DB Admin
  - Integrity Constraints / SHACL
  - Data Caching
  - Graph Store Protocol
  - Matcher, aligning schemas from various data sources
  - Reasoning
  - Transactions
  - GraphQL
  - SPARQL
  - EntityResolution
- name: Security
  tags:
  - Roles
  - Permissions
  - Users
- name: Knowledge Catalog
  tags:
  - Knowledge Catalog
