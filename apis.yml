aid: stardog
name: Stardog
description: >-
  Stardog is an enterprise knowledge graph platform that unifies data across
  silos using a semantic data layer combining knowledge graphs, virtualization,
  inference, and AI. The platform enables organizations to query data via
  SPARQL, GraphQL, and natural language while supporting RDF, OWL reasoning,
  and virtual graphs over relational sources. Stardog exposes a comprehensive
  HTTP API for database, query, transaction, and admin operations using HTTP
  Basic or OAuth Bearer authentication.
